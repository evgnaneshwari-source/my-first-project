<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearLedger — Expense Tracker</title>
    <meta
      name="description"
      content="A clean, minimalist personal finance and expense tracking web application built with HTML5, CSS3, and Vanilla JavaScript."
    />
    <meta property="og:title" content="ClearLedger — Expense Tracker" />
    <meta
      property="og:description"
      content="A clean, minimalist personal finance and expense tracking web application built with HTML5, CSS3, and Vanilla JavaScript."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Chart.js & Lucide Icons via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Mobile Sidebar Backdrop -->
      <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <!-- Sidebar Navigation -->
      <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
        <div class="sidebar-brand">
          <img src="./assets/logo.svg" alt="" class="brand-logo" width="28" height="28" />
          <span class="brand-name">ClearLedger</span>
          <button
            id="sidebar-close-btn"
            class="icon-btn mobile-only"
            type="button"
            aria-label="Close navigation menu"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <nav class="sidebar-nav" role="navigation">
          <button type="button" class="nav-link is-active" data-view="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
          </button>
          <button type="button" class="nav-link" data-view="transactions">
            <i data-lucide="arrow-left-right"></i>
            <span>Transactions</span>
          </button>
          <button type="button" class="nav-link" data-view="analytics">
            <i data-lucide="bar-chart-3"></i>
            <span>Analytics</span>
          </button>
          <button type="button" class="nav-link" data-view="budget">
            <i data-lucide="wallet"></i>
            <span>Budget</span>
          </button>
          <button type="button" class="nav-link" data-view="subscriptions">
            <i data-lucide="repeat"></i>
            <span>Subscriptions</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-section-label">Data Controls</div>
          <button type="button" id="btn-export-csv" class="sidebar-utility-btn">
            <i data-lucide="download"></i>
            <span>Export CSV</span>
          </button>
          <button type="button" id="btn-reset-demo" class="sidebar-utility-btn">
            <i data-lucide="rotate-ccw"></i>
            <span>Load Sample Data</span>
          </button>
          <button type="button" id="btn-clear-data" class="sidebar-utility-btn is-danger">
            <i data-lucide="trash-2"></i>
            <span>Clear All Data</span>
          </button>
        </div>
      </aside>

      <!-- Main Workspace -->
      <div class="workspace">
        <!-- Top Navigation Bar -->
        <header class="topbar">
          <div class="topbar-left">
            <button
              id="sidebar-open-btn"
              class="icon-btn mobile-only"
              type="button"
              aria-label="Open navigation menu"
            >
              <i data-lucide="menu"></i>
            </button>
            <div class="breadcrumb" aria-label="Current location">
              <span class="breadcrumb-root">Workspace</span>
              <span class="breadcrumb-sep" aria-hidden="true">/</span>
              <h1 id="topbar-title" class="topbar-title">Dashboard</h1>
            </div>
          </div>

          <div class="topbar-actions">
            <div class="month-picker-wrap">
              <label for="global-month-select" class="sr-only">Active month</label>
              <select id="global-month-select" class="select-control select-compact" aria-label="Select active month"></select>
            </div>
            <button type="button" id="btn-open-add-modal" class="btn btn-primary">
              <i data-lucide="plus"></i>
              <span>Add Transaction</span>
            </button>
          </div>
        </header>

        <!-- Main View Content -->
        <main class="main-content" id="main-content">
          <!-- Server Status / Loading / Error Banner Region -->
          <div id="global-status-region" aria-live="polite"></div>

          <!-- Feature 1: Dashboard View -->
          <section id="view-dashboard" class="view-panel is-active" aria-labelledby="topbar-title"></section>

          <!-- Feature 3: Transaction History View -->
          <section id="view-transactions" class="view-panel" hidden aria-label="Transaction History"></section>

          <!-- Feature 4: Expense Analytics View -->
          <section id="view-analytics" class="view-panel" hidden aria-label="Expense Analytics"></section>

          <!-- Feature 5: Budget Management View -->
          <section id="view-budget" class="view-panel" hidden aria-label="Budget Management"></section>

          <!-- Feature 6: Subscription Tracker View -->
          <section id="view-subscriptions" class="view-panel" hidden aria-label="Subscription Tracker"></section>
        </main>
      </div>
    </div>

    <!-- Feature 2: Add / Edit Transaction Modal -->
    <div
      id="transaction-modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="transaction-modal-title"
      hidden
    >
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <h2 id="transaction-modal-title" class="modal-title">Add Transaction</h2>
            <p id="transaction-modal-subtitle" class="modal-subtitle">
              Record a new income or expense entry.
            </p>
          </div>
          <button
            type="button"
            id="transaction-modal-close"
            class="icon-btn"
            aria-label="Close transaction dialog"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <form id="transaction-form" class="modal-body" novalidate>
          <input type="hidden" id="txn-id" name="id" value="" />

          <!-- Type Segmented Switch -->
          <div class="form-group">
            <span class="form-label">Transaction Type</span>
            <div class="segmented-control" role="radiogroup" aria-label="Transaction Type">
              <button
                type="button"
                class="segmented-btn is-active"
                data-type="expense"
                id="type-btn-expense"
                aria-pressed="true"
              >
                <i data-lucide="arrow-down-right"></i>
                <span>Expense</span>
              </button>
              <button
                type="button"
                class="segmented-btn"
                data-type="income"
                id="type-btn-income"
                aria-pressed="false"
              >
                <i data-lucide="arrow-up-right"></i>
                <span>Income</span>
              </button>
            </div>
            <input type="hidden" id="txn-type" name="type" value="expense" />
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="txn-title" class="form-label">Title <span class="required-mark">*</span></label>
              <input
                type="text"
                id="txn-title"
                name="title"
                class="input-control"
                placeholder="e.g., Grocery Shopping"
                maxlength="80"
                required
              />
              <span class="field-error" id="err-txn-title" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="txn-amount" class="form-label">Amount ($) <span class="required-mark">*</span></label>
              <input
                type="number"
                id="txn-amount"
                name="amount"
                class="input-control mono-input"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
              />
              <span class="field-error" id="err-txn-amount" role="alert"></span>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="txn-category" class="form-label">Category <span class="required-mark">*</span></label>
              <select id="txn-category" name="category" class="select-control" required></select>
              <span class="field-error" id="err-txn-category" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="txn-date" class="form-label">Date <span class="required-mark">*</span></label>
              <input
                type="date"
                id="txn-date"
                name="date"
                class="input-control mono-input"
                required
              />
              <span class="field-error" id="err-txn-date" role="alert"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="txn-description" class="form-label">Description</label>
            <textarea
              id="txn-description"
              name="description"
              class="textarea-control"
              rows="3"
              maxlength="240"
              placeholder="Optional notes, merchant details, or payment method"
            ></textarea>
            <span class="field-error" id="err-txn-description" role="alert"></span>
          </div>

          <div class="modal-footer">
            <button type="button" id="transaction-modal-cancel" class="btn btn-secondary">
              Cancel
            </button>
            <button type="submit" id="transaction-submit-btn" class="btn btn-primary">
              Save Transaction
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Feature 6: Add / Edit Subscription Modal -->
    <div
      id="subscription-modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="subscription-modal-title"
      hidden
    >
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <h2 id="subscription-modal-title" class="modal-title">Add Subscription</h2>
            <p id="subscription-modal-subtitle" class="modal-subtitle">
              Track a new recurring subscription service.
            </p>
          </div>
          <button
            type="button"
            id="subscription-modal-close"
            class="icon-btn"
            aria-label="Close subscription dialog"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <form id="subscription-form" class="modal-body" novalidate>
          <input type="hidden" id="sub-id" name="id" value="" />

          <!-- Billing Cycle Segmented Switch -->
          <div class="form-group">
            <span class="form-label">Billing Cycle</span>
            <div class="segmented-control" role="radiogroup" aria-label="Billing Cycle">
              <button
                type="button"
                class="segmented-btn is-active"
                data-cycle="monthly"
                id="sub-cycle-monthly"
                aria-pressed="true"
              >
                <i data-lucide="calendar"></i>
                <span>Monthly</span>
              </button>
              <button
                type="button"
                class="segmented-btn"
                data-cycle="yearly"
                id="sub-cycle-yearly"
                aria-pressed="false"
              >
                <i data-lucide="calendar-range"></i>
                <span>Yearly</span>
              </button>
            </div>
            <input type="hidden" id="sub-cycle" name="billing_cycle" value="monthly" />
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="sub-name" class="form-label">Service Name <span class="required-mark">*</span></label>
              <input
                type="text"
                id="sub-name"
                name="name"
                class="input-control"
                placeholder="e.g., Netflix, Spotify, Amazon Prime"
                maxlength="80"
                required
              />
              <span class="field-error" id="err-sub-name" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="sub-amount" class="form-label">Cost ($) <span class="required-mark">*</span></label>
              <input
                type="number"
                id="sub-amount"
                name="amount"
                class="input-control mono-input"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
              />
              <span class="field-error" id="err-sub-amount" role="alert"></span>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="sub-category" class="form-label">Category <span class="required-mark">*</span></label>
              <select id="sub-category" name="category" class="select-control" required></select>
              <span class="field-error" id="err-sub-category" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="sub-renewal-date" class="form-label">Next Renewal Date <span class="required-mark">*</span></label>
              <input
                type="date"
                id="sub-renewal-date"
                name="renewal_date"
                class="input-control mono-input"
                required
              />
              <span class="field-error" id="err-sub-renewal-date" role="alert"></span>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="sub-status" class="form-label">Status</label>
              <select id="sub-status" name="status" class="select-control">
                <option value="active">Active</option>
                <option value="cancelled">Cancelled</option>
                <option value="expired">Expired</option>
              </select>
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; justify-content: center;">
              <span class="form-label">Usage Review</span>
              <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; margin-top: 6px;">
                <input type="checkbox" id="sub-unused" name="is_unused" style="width: 16px; height: 16px; accent-color: var(--primary);" />
                <span>Mark as unused (flag to review/cancel)</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="sub-description" class="form-label">Plan / Notes</label>
            <textarea
              id="sub-description"
              name="description"
              class="textarea-control"
              rows="2"
              maxlength="240"
              placeholder="e.g., Family tier, payment method, shared with roommate"
            ></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" id="subscription-modal-cancel" class="btn btn-secondary">
              Cancel
            </button>
            <button type="submit" id="subscription-submit-btn" class="btn btn-primary">
              Save Subscription
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirmation Dialog (Delete / Clear / Reset) -->
    <div
      id="confirm-modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      hidden
    >
      <div class="modal-dialog modal-dialog-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title" class="modal-title">Confirm Action</h2>
          <button
            type="button"
            id="confirm-modal-close"
            class="icon-btn"
            aria-label="Close confirmation dialog"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <p id="confirm-modal-message" class="confirm-message"></p>
        </div>
        <div class="modal-footer">
          <button type="button" id="confirm-modal-cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="confirm-modal-confirm" class="btn btn-danger">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Subtle Notification Toast Region -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
